<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Star Points">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff9500'/%3E%3Cpath transform='translate(6.4 6.4) scale(.8)' fill='%23fff' d='M12 2.2l3 6.3 6.9.9-5 4.8 1.2 6.8L12 17.7 5.9 21l1.2-6.8-5-4.8 6.9-.9z'/%3E%3C/svg%3E">
  <meta name="robots" content="noindex">
  <title>Star Points · Teacher</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header class="top">
    <div class="bar">
      <h1 class="brand"><span class="logo"></span>Star Points <small>Teacher</small></h1>
      <button id="logout" class="text" hidden>Log out</button>
    </div>
  </header>
  <div class="wrap">
    <main id="app"></main>
  </div>

  <dialog id="edit-dialog">
    <form id="edit-form" method="dialog">
      <h2>Edit student</h2>
      <div class="field">
        <label for="edit-name">Name</label>
        <input id="edit-name" required maxlength="80">
      </div>
      <div class="field">
        <label for="edit-stars">Stars</label>
        <input id="edit-stars" type="number" min="0" required>
      </div>
      <div class="row">
        <button type="submit">Save</button>
        <button type="button" class="ghost" id="edit-cancel">Cancel</button>
        <button type="button" class="danger" id="edit-delete">Delete student</button>
      </div>
    </form>
  </dialog>

  <script src="../config.js"></script>
  <script src="../assets/api.js"></script>
  <script src="../assets/teacher.js"></script>
</body>
</html>
